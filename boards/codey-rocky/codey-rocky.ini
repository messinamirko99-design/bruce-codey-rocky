; PlatformIO Project Configuration File
; Makeblock Codey Rocky - Bruce port on the 16x8 LED matrix
; Docs: https://docs.platformio.org/page/projectconf.html

[env:codey-rocky]
board = codey-rocky
board_build.partitions = custom_4Mb_full.csv
build_src_filter =${env.build_src_filter} +<../boards/codey-rocky>
build_flags =
	${env.build_flags}
	${env_4mb.build_flags}

	-Iboards/codey-rocky

	;LITE_VERSION keeps the 4MB build small (no LoRa/Ethernet/GIF/JS)
	-DLITE_VERSION=1

	;Buttons Setup (A=2 active HIGH, B=12 active HIGH, C=27 active LOW)
	-DHAS_BTN=1
	-DSEL_BTN=2
	-DUP_BTN=27
	-DDW_BTN=12
	-DPWR_BTN=34
	-DBTN_ACT=HIGH
	-DBTN_ALIAS='"A"'

	;Infrared Led default pin and state (V1.0.7 hardware)
	-DTXLED=26
	-DRXLED=5
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{ {"Default", TXLED}, {"G26", 26}, {"G25", 25}, {"G14", 14} }'
	-DIR_RX_PINS='{ {"Default", RXLED}, {"G5", 5}, {"G35", 35}, {"G36", 36} }'
	-DRF_TX_PINS='{ {"Default", 26}, {"G25", 25}, {"G14", 14} }'
	-DRF_RX_PINS='{ {"Default", 5}, {"G35", 35}, {"G36", 36} }'

	;Battery ADC read pin
	-DBAT_PIN=33

	;Buzzer / speaker (LEDC tone on the DAC pin)
	-DBUZZ_PIN=25

	;Font sizes (single tiny font on the matrix)
	-DFP=1
	-DFM=1
	-DFG=1

	;Screen Setup - 16x8 LED matrix (TM1640)
	;Driver tunables, same values as the hardware-tested codey-sniffer
	;-DMATRIX_BIT_DELAY_US=3
	;-DMATRIX_FLIP_X=0   ; set to 1 if the panel appears mirrored
	;-DMATRIX_FLIP_Y=0   ; set to 1 if the panel appears upside-down
	-DHAS_SCREEN=1
	-DUSE_LEDMATRIX
	-DTINY_DISPLAY
	-DTFT_WIDTH=16
	-DTFT_HEIGHT=8
	-DROTATION=0

	;Default I2C port (shared with the MPU6050)
	-DGROVE_SDA=19
	-DGROVE_SCL=18

	-DCODEY_ROCKY=1
	-DDEVICE_NAME='"Codey Rocky"'

lib_deps =
	${env.lib_deps}

lib_ignore =
	${env_4mb.lib_ignore}

[env:LAUNCHER_codey-rocky]
extends=env:codey-rocky
board_build.partitions = custom_4Mb.csv
build_flags =
	${env:codey-rocky.build_flags}
	${env_light.build_flags}
lib_deps =
	${env_light.lib_deps}
